<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5BEA">
<title>Темп</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F7;--card:#fff;--ink:#14212B;--mut:#5E6D79;--line:#DCE3E9;--acc:#2F5BEA;--accInk:#fff;--warm:#E58A12;--ok:#1E9E6A;--bad:#D6453D;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101820;--card:#18232D;--ink:#EAF0F5;--mut:#98A8B5;--line:#2A3844;--acc:#6D8DFF;--accInk:#0C1220;--warm:#F2A03A;--ok:#43C690;--bad:#F0726A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101820;--card:#18232D;--ink:#EAF0F5;--mut:#98A8B5;--line:#2A3844;--acc:#6D8DFF;--accInk:#0C1220;--warm:#F2A03A;--ok:#43C690;--bad:#F0726A;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:84px 16px 40px}
h1{font-size:30px;font-weight:800;margin:4px 0 4px;letter-spacing:-.02em}
h2{font-size:19px;font-weight:800;margin:0 0 10px}
.sub{color:var(--mut);font-size:15px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:52px;font-size:17px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;min-height:52px;padding:0 18px;font-size:17px;background:var(--acc);color:var(--accInk);cursor:pointer}
button.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
button.del{background:transparent;color:var(--bad);min-height:36px;padding:0 8px;flex:0}
.big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:6px 0 2px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar i.warm{background:var(--warm)}.bar i.ok{background:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}.kv:last-child{border:0}.kv b{font-weight:800}
.meal{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.meal span:first-child{flex:1}.meal small{color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;min-height:56px;font-size:11px;font-weight:600;padding:0 2px}.ex{padding:8px 0;border-bottom:1px solid var(--line)}.ex:last-of-type{border:0}.ex small{color:var(--mut)}.ex summary{cursor:pointer;min-height:32px}.cb{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.cb input{width:22px;min-height:22px;flex:0}.cb span{flex:1}.cb.dn span{text-decoration:line-through;color:var(--mut)}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{min-height:46px;font-size:16px;padding:0 16px}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--bg);border:1px solid var(--line)}
svg text{fill:var(--mut);font-size:10px;font-family:inherit}
.empty{color:var(--mut);text-align:center;padding:18px 6px;font-size:14px}
.hist{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;min-height:56px;padding:8px 12px}
.hist small{color:var(--mut);display:block;font-weight:400}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}

#hd{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line)}
#bg{flex:0 0 52px;width:52px;padding:0;background:var(--card);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
#ttl{font-size:21px;font-weight:800}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#dr{position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);background:var(--card);z-index:40;transform:translateX(-102%);transition:transform .25s;padding:calc(22px + env(safe-area-inset-top,0px)) 14px 24px;overflow:auto;box-shadow:4px 0 24px rgba(0,0,0,.25)}
body.open #ov{opacity:1;pointer-events:auto}body.open #dr{transform:none}
#dr .brand{font-size:26px;font-weight:800;margin:0 10px 4px}#dr .bs{color:var(--mut);font-size:14px;margin:0 10px 18px}
#dr button.it{display:block;width:100%;text-align:left;background:none;color:var(--ink);font-size:19px;min-height:60px;border-radius:16px;padding:0 18px;margin-bottom:6px;font-weight:600}
#dr button.it.on{background:var(--acc);color:var(--accInk);font-weight:800}
.acc>h2{cursor:pointer;margin:0;display:flex;justify-content:space-between;align-items:center;min-height:36px}
.acc>h2::after{content:'›';font-size:30px;line-height:1;color:var(--mut);transform:rotate(90deg);transition:transform .2s}
.acc.op>h2::after{transform:rotate(-90deg)}
.acc .bd{display:none;margin-top:12px}.acc.op .bd{display:block}
</style>
</head>
<body>
<main id="app"></main>
<header id="hd"><button id="bg" onclick="openDr()" aria-label="Открыть меню"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span id="ttl"></span></header><div id="ov" onclick="closeDr()"></div><aside id="dr"></aside>
<div id="toast"></div>
<script>
const KEY='temp_app_v1';
let S={profile:null,days:{},theme:'auto'};
let tab='today',date=iso(new Date()),range=14,metric='weight';
function iso(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Не удалось сохранить: хранилище недоступно')}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
const $=id=>document.getElementById(id);
const ACT={'1.2':'Сидячий','1.375':'Умеренно активный','1.55':'Высокоактивный'};
const GOAL={loss:'Снижение жира',gain:'Набор массы',keep:'Поддержание'};
function calc(p){
  if(!p)return null;
  const w=p.weight,bmr=10*w+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const tdee=bmr*p.act;
  let k=tdee*(p.goal==='loss'?0.82:p.goal==='gain'?1.1:1);
  if(p.goal==='loss')k=Math.max(k,bmr);
  const prot=w*(p.goal==='loss'?2.0:p.goal==='gain'?1.8:1.6);
  const fat=Math.max(w*0.9,k*0.2/9);
  const carb=Math.max(0,(k-prot*4-fat*9)/4);
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:Math.round(k),prot:Math.round(prot),fat:Math.round(fat),carb:Math.round(carb),fiber:Math.max(25,Math.round(k/1000*14)),water:Math.round(w*30/50)*50,bmi:(w/Math.pow(p.height/100,2)).toFixed(1)};
}
function day(d){return S.days[d]||(S.days[d]={m:{},weight:null,meals:[],water:0,workout:{done:false,type:'',min:0},note:''})}
function totals(d){const x=S.days[d],z={kcal:0,prot:0,fat:0,carb:0};if(!x)return z;return x.meals.reduce((a,m)=>({kcal:a.kcal+m.kcal,prot:a.prot+m.prot,fat:a.fat+(m.fat||0),carb:a.carb+(m.carb||0)}),z)}
function curWeight(){const ds=Object.keys(S.days).filter(k=>S.days[k].weight).sort();return ds.length?S.days[ds[ds.length-1]].weight:(S.profile?S.profile.weight:null)}
function fmtDate(d){const t=new Date(d+'T12:00:00');return t.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}

function render(){
  document.documentElement.dataset.theme=S.theme==='auto'?'':S.theme;
  if(!S.profile&&tab!=='profile')tab='profile';
  const names=[['today','Сегодня'],['plan','План'],['menu','Питание'],['stats','Статистика'],['history','История'],['profile','Профиль']];
  $('dr').innerHTML='<div class="brand">Темп</div><div class="bs">Тренировки и питание</div>'+names.map(n=>`<button class="it ${tab===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');$('ttl').textContent=(names.find(n=>n[0]===tab)||names[0])[1];
  $('app').innerHTML=banner()+({today:vToday,plan:vPlan,menu:vMenu,stats:vStats,history:vHistory,profile:vProfile})[tab]();
  window.scrollTo(0,0);if(tab==='today')lf();acc();
}
function go(t){tab=t;closeDr();render()}
function openDr(){document.body.classList.add('open')}
function closeDr(){document.body.classList.remove('open')}

function vToday(){
  const c=calc(S.profile),x=S.days[date]||{weight:null,meals:[],water:0,workout:{done:false,type:'',min:0},note:''},t=totals(date);
  const left=c.kcal-t.kcal;
  return `<h1>${date===iso(new Date())?'Сегодня':'День'}</h1>
  <div class="row" style="margin-bottom:12px"><button class="sec" style="flex:0" onclick="shift(-1)" aria-label="Предыдущий день">‹</button><input type="date" value="${date}" onchange="date=this.value;render()"><button class="sec" style="flex:0" onclick="shift(1)" aria-label="Следующий день">›</button></div>
  <div class="card"><div class="sub" style="margin:0">Калории</div><div class="big">${t.kcal} <span style="font-size:16px;font-weight:600;color:var(--mut)">из ${c.kcal} ккал</span></div>
  <div class="bar"><i class="${t.kcal>c.kcal*1.05?'warm':''}" style="width:${pct(t.kcal,c.kcal)}%"></i></div>
  <div class="sub" style="margin:2px 0 10px">${left>=0?'Осталось '+left+' ккал':'Превышение '+(-left)+' ккал'}</div>
  <div class="sub" style="margin:0">Белок: ${Math.round(t.prot)} из ${c.prot} г</div><div class="bar"><i class="ok" style="width:${pct(t.prot,c.prot)}%"></i></div><div class="sub" style="margin:8px 0 0">Жиры: ${Math.round(t.fat)} из ${c.fat} г · Углеводы: ${Math.round(t.carb)} из ${c.carb} г</div></div>
  <div class="card"><h2>Приёмы пищи</h2>
  ${x.meals.length?x.meals.map((m,i)=>`<div class="meal"><span>${esc(m.name)}<br><small>${m.kcal} ккал · Б ${m.prot} · Ж ${m.fat||0} · У ${m.carb||0}</small></span><button class="del" onclick="delMeal(${i})" aria-label="Удалить">Удалить</button></div>`).join(''):'<div class="empty">Пока ничего не добавлено</div>'}
  ${foodForm()}</div>
  <div class="card"><h2>Вес</h2><div class="row"><input id="wt" type="number" inputmode="decimal" step="0.1" value="${x.weight||''}" placeholder="кг"><button onclick="setW()">Сохранить вес</button></div></div>
  <div class="card"><h2>Вода</h2><div class="big">${(x.water/1000).toFixed(2).replace('.',',')} <span style="font-size:16px;font-weight:600;color:var(--mut)">из ${(c.water/1000).toFixed(1).replace('.',',')} л</span></div>
  <div class="bar"><i style="width:${pct(x.water,c.water)}%"></i></div>
  <div class="row" style="margin-top:8px"><button class="sec" onclick="water(-250)">−250 мл</button><button onclick="water(250)">+250 мл</button><button onclick="water(500)">+500 мл</button></div></div>
  ${planToday(date)}${logCard(x)}
  ${measCard(x)}<div class="card"><h2>Заметка</h2><textarea id="nt" onchange="note()" placeholder="Самочувствие, сон, нагрузка">${esc(x.note)}</textarea></div>`;
}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function shift(n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);date=iso(d);render()}
function delMeal(i){day(date).meals.splice(i,1);save();render()}
function setW(){const v=parseFloat($('wt').value);if(!(v>20&&v<400)){toast('Введите вес от 20 до 400 кг');return}day(date).weight=v;save();toast('Вес сохранён');render()}
function water(n){const x=day(date);x.water=Math.max(0,x.water+n);save();render()}
function wo(k){const w=day(date).workout;if(k==='done')w.done=!w.done;if(k==='type')w.type=$('wtp').value;if(k==='min')w.min=+$('wmn').value||0;save();if(k==='done')render()}
function note(){day(date).note=$('nt').value;save();toast('Заметка сохранена')}

function lastDays(n){const a=[];const d=new Date();for(let i=n-1;i>=0;i--){const t=new Date(d);t.setDate(d.getDate()-i);a.push(iso(t))}return a}
function chart(vals,labels,opts){
  const W=320,H=140,pl=30,pb=18,pt=8,pr=6,pts=vals.map((v,i)=>({v,i})).filter(p=>p.v!=null);
  if(!pts.length)return '<div class="empty">Нет данных за период</div>';
  let mn=Math.min(...pts.map(p=>p.v),opts.target!=null?opts.target:Infinity),mx=Math.max(...pts.map(p=>p.v),opts.target!=null?opts.target:-Infinity);
  if(opts.zero)mn=0;if(mx===mn){mx+=1;mn-=1}const pad=opts.zero?0:(mx-mn)*0.15;mn-=pad;mx+=pad;if(opts.zero)mx*=1.08;
  const n=vals.length,X=i=>pl+(n===1?0:i*(W-pl-pr)/(n-1)),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${opts.label}">`;
  for(let k=0;k<4;k++){const v=mn+(mx-mn)*k/3,y=Y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-4}" y="${y+3}" text-anchor="end">${Math.round(v*10)/10}</text>`}
  if(opts.target!=null)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(opts.target)}" y2="${Y(opts.target)}" stroke="var(--warm)" stroke-dasharray="4 3"/>`;
  if(opts.bars){const bw=Math.max(3,(W-pl-pr)/n*0.6);pts.forEach(p=>{s+=`<rect x="${X(p.i)-bw/2}" y="${Y(p.v)}" width="${bw}" height="${Y(mn)-Y(p.v)}" rx="2" fill="var(--acc)"/>`})}
  else{s+=`<polyline fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>X(p.i)+','+Y(p.v)).join(' ')}"/>`+pts.map(p=>`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="3" fill="var(--acc)"/>`).join('')}
  const st=Math.ceil(n/6);labels.forEach((l,i)=>{if(i%st===0)s+=`<text x="${X(i)}" y="${H-4}" text-anchor="middle">${l}</text>`});
  return s+'</svg>';
}
function vStats(){
  const c=calc(S.profile),ds=lastDays(range),lab=ds.map(d=>d.slice(8)+'.'+d.slice(5,7));
  const get=d=>S.days[d];
  const M={weight:{t:'Вес, кг',v:ds.map(d=>get(d)&&get(d).weight||null),o:{}},
   kcal:{t:'Калории, ккал',v:ds.map(d=>get(d)&&get(d).meals.length?totals(d).kcal:null),o:{bars:1,zero:1,target:c.kcal}},
   prot:{t:'Белок, г',v:ds.map(d=>get(d)&&get(d).meals.length?Math.round(totals(d).prot):null),o:{bars:1,zero:1,target:c.prot}},
   water:{t:'Вода, мл',v:ds.map(d=>get(d)&&get(d).water?get(d).water:null),o:{bars:1,zero:1,target:c.water}},
   min:{t:'Тренировки, минут',v:ds.map(d=>minOf(d)||null),o:{bars:1,zero:1}}};
  [['waist','Талия'],['chest','Грудь'],['hips','Бёдра'],['arm','Рука']].forEach(a=>M[a[0]]={t:a[1]+', см',v:ds.map(d=>get(d)&&get(d).m&&get(d).m[a[0]]||null),o:{}});const m=M[metric];m.o.label=m.t;
  const avg=a=>{const v=a.filter(x=>x!=null);return v.length?Math.round(v.reduce((p,q)=>p+q,0)/v.length):'—'};
  const wd=ds.filter(d=>get(d)&&get(d).workout.done).length,logged=ds.filter(d=>get(d)&&(get(d).meals.length||get(d).weight||get(d).water)).length;
  const ws=M.weight.v.filter(v=>v!=null),dw=ws.length>1?(ws[ws.length-1]-ws[0]).toFixed(1).replace('.',','):'—';
  return `<h1>Статистика</h1><p class="sub">Собирается автоматически из ваших записей по дням</p>
  <div class="chips" style="margin-bottom:12px">${[[7,'7 дней'],[14,'14 дней'],[30,'30 дней'],[90,'90 дней']].map(r=>`<button class="${range===r[0]?'':'sec'}" onclick="range=${r[0]};render()">${r[1]}</button>`).join('')}</div>
  <div class="card"><div class="chips" style="margin-bottom:10px">${Object.keys(M).map(k=>`<button class="${metric===k?'':'sec'}" onclick="metric='${k}';render()">${M[k].t.split(',')[0]}</button>`).join('')}</div>
  <h2>${m.t}</h2>${chart(m.v,lab,m.o)}${m.o.target!=null?'<div class="sub" style="margin:4px 0 0">Пунктир — ваша норма</div>':''}</div>
  ${strCard(ds,lab)}<div class="card"><h2>За ${range} дн.</h2>
  <div class="kv"><span>Дней с записями</span><b>${logged}</b></div>
  <div class="kv"><span>Тренировок выполнено</span><b>${wd}</b></div>
  <div class="kv"><span>Изменение веса</span><b>${dw}${dw==='—'?'':' кг'}</b></div>
  <div class="kv"><span>Среднее: калории</span><b>${avg(M.kcal.v)}</b></div>
  <div class="kv"><span>Среднее: белок</span><b>${avg(M.prot.v)} г</b></div>
  <div class="kv"><span>Среднее: вода</span><b>${avg(M.water.v)} мл</b></div></div>`;
}
function vHistory(){
  const ks=Object.keys(S.days).sort().reverse().filter(k=>{const x=S.days[k];return x.meals.length||x.weight||x.water||x.workout.done||x.note});
  return `<h1>История</h1><p class="sub">Все дни, за которые есть записи. Нажмите, чтобы открыть и изменить.</p>
  ${ks.length?ks.map(k=>{const x=S.days[k],t=totals(k);return `<button class="hist" onclick="date='${k}';go('today')"><span>${fmtDate(k)}<small>${t.kcal} ккал · белок ${Math.round(t.prot)} г · вода ${x.water} мл</small></span><span style="text-align:right">${x.weight?x.weight+' кг':''}<small>${x.workout.done?'Тренировка'+(x.workout.min?' '+x.workout.min+' мин':''):''}</small></span></button>`}).join(''):'<div class="card empty">Записей пока нет. Добавьте первый приём пищи или вес на вкладке «Сегодня».</div>'}`;
}
function vProfile(){
  const p=S.profile||{sex:'m',age:'',height:'',weight:'',act:1.375,goal:'loss'},c=calc(S.profile);
  return `<h1>Профиль</h1><p class="sub">${S.profile?'Расчёты обновятся после сохранения':'Введите данные, и приложение рассчитает норму калорий, белка, воды'}</p>
  <div class="card"><label>Пол</label><select id="ps"><option value="m" ${p.sex==='m'?'selected':''}>Мужской</option><option value="f" ${p.sex==='f'?'selected':''}>Женский</option></select>

function mkIng(s){return s.split(',').map(x=>{const m=x.match(/^(.*?)\s*(\d+)$/);return [m[1].trim(),+m[2]]})}
const R=RAW.map(a=>({t:a[0],m:a[1],n:a[2],ing:mkIng(a[3]),how:a[4]}));
const MT={b:'Завтрак',l:'Обед',d:'Ужин',s:'Перекус'};
let mday=0,mt='menu';
function pr(n){return(S.prices&&S.prices[n])||FD[n][4]}
function rub(v){return Math.round(v/10)*10}
function fm(v){return rub(v).toLocaleString('ru-RU')+' ₽'}
function rk(r,f){let p=0,fa=0,c=0,u=0;r.ing.forEach(i=>{const d=FD[i[0]],g=i[1]*f/100;p+=d[0]*g;fa+=d[1]*g;c+=d[2]*g;u+=pr(i[0])*i[1]*f/1000});return{p,f:fa,c,k:4*p+9*fa+4*c,r:u}}
function okR(r){const ex=S.excl||[],veg=S.profile.diet==='veg';return r.ing.every(i=>ex.indexOf(i[0])<0&&!(veg&&FD[i[0]][3]==='Мясо и рыба'))}
function menuL(t){return R.map((r,i)=>i).filter(i=>R[i].t===t&&okR(R[i]))}
function gr(g){return Math.max(5,Math.round(g/5)*5)}
function scaleOf(ids,c){const b=ids.reduce((a,i)=>a+rk(R[i],1).k,0);return b?Math.max(.7,Math.min(1.6,c.kcal/b)):1}
function wkCost(m,c){return m.d.reduce((s,ids)=>{const f=scaleOf(ids,c);return s+ids.reduce((a,i)=>a+rk(R[i],f).r,0)},0)}
function getMenu(){const c=calc(S.profile),sig=JSON.stringify([S.profile.diet,S.excl||[],S.budget||0,c.kcal,S.prices||{}]);
if(!S.menu||S.menu.sig!==sig){const T=['b','l','d','s'],Ls=T.map(menuL);
const m={sig,d:[0,1,2,3,4,5,6].map(i=>T.map((t,j)=>Ls[j].length?Ls[j][i%Ls[j].length]:null).filter(x=>x!==null))};
if(S.budget)for(let it=0;it<80&&wkCost(m,c)>S.budget;it++){let b=null;
m.d.forEach((ids,di)=>{const f=scaleOf(ids,c);ids.forEach((id,j)=>{const cur=rk(R[id],f).r,al=menuL(R[id].t).map(a=>[a,rk(R[a],f).r]).filter(x=>x[1]<cur-1).sort((x,y)=>x[1]-y[1]);if(al.length&&(!b||cur-al[0][1]>b.g))b={di,j,a:al[0][0],g:cur-al[0][1]}})});
if(!b)break;m.d[b.di][b.j]=b.a}
S.menu=m;save()}return S.menu}
function swap(d,j){const m=getMenu(),L=menuL(R[m.d[d][j]].t);if(L.length<2)return;m.d[d][j]=L[(L.indexOf(m.d[d][j])+1)%L.length];save();render()}
function tShop(n){S.shop=S.shop||{};S.shop[n]=!S.shop[n];save();render()}
function tEx(n){const e=S.excl||(S.excl=[]),i=e.indexOf(n);if(i<0)e.push(n);else e.splice(i,1);save();render()}
function exCat(g){const e=S.excl||[],ns=Object.keys(FD).filter(n=>FD[n][3]===g),all=ns.every(n=>e.indexOf(n)>=0);S.excl=e.filter(n=>ns.indexOf(n)<0).concat(all?[]:ns);save();render()}

const tabs=`<div class="chips" style="margin-bottom:12px">${[['menu','Меню'],['shop','Покупки'],['set','Бюджет и исключения']].map(a=>`<button class="${mt===a[0]?'':'sec'}" onclick="mt='${a[0]}';render()">${a[1]}</button>`).join('')}</div>`;

if(mt==='shop'){const A={},G={};m.d.forEach(ids=>{const f=scaleOf(ids,c);ids.forEach(i=>R[i].ing.forEach(x=>{A[x[0]]=(A[x[0]]||0)+x[1]*f}))});Object.keys(A).forEach(n=>(G[FD[n][3]]=G[FD[n][3]]||[]).push(n));const sh=S.shop||{};
return `<h1>Покупки</h1><p class="sub">Продукты на 7 дней по вашему меню. Цены примерные, для Владивостока.</p>${tabs}${note}
<div class="card"><div class="kv"><span>Всего ≈</span><b ${over?'style="color:var(--bad)"':''}>${fm(cost)}</b></div>${S.budget?`<div class="kv"><span>Ваш бюджет</span><b>${fm(S.budget)}</b></div>`:''}${over?'<p class="sub" style="margin:8px 0 0">Даже самое дешёвое меню из доступных блюд выходит дороже бюджета. Увеличьте бюджет или уберите дорогие продукты из исключений.</p>':''}</div>
${CATS.filter(g=>G[g]).map(g=>`<div class="card"><h2>${g}</h2>${G[g].map(n=>`<label class="cb ${sh[n]?'dn':''}" style="margin:0;color:var(--ink);font-size:15px"><input type="checkbox" ${sh[n]?'checked':''} onchange="tShop('${n}')"><span>${n}<br><small style="color:var(--mut)">${A[n]>=1000?(A[n]/1000).toFixed(1).replace('.',',')+' кг':gr(A[n])+' г'}${n==='Яйца'?' (~'+Math.round(A[n]/50)+' шт)':''}</small></span><b>${fm(pr(n)*A[n]/1000)}</b></label>`).join('')}</div>`).join('')}<button class="sec" style="width:100%" onclick="S.shop={};save();render()">Сбросить отметки</button>`}
const ids=m.d[mday]||[],f=scaleOf(ids,c),tot=ids.reduce((a,i)=>{const r=rk(R[i],f);return{k:a.k+r.k,p:a.p+r.p,f:a.f+r.f,c:a.c+r.c,r:a.r+r.r}},{k:0,p:0,f:0,c:0,r:0});
return `<h1>Питание</h1><p class="sub">Простые блюда из обычного магазина. Порции подогнаны под вашу норму.</p>${tabs}${note}

${ids.map((i,j)=>{const r=R[i],x=rk(r,f);return `<div class="card"><b>${MT[r.t]}: ${r.n}</b><div class="sub" style="margin:2px 0 0">${Math.round(x.k)} ккал · Б ${Math.round(x.p)} · Ж ${Math.round(x.f)} · У ${Math.round(x.c)} · ≈ ${fm(x.r)} · ${r.m} мин</div><p style="margin:8px 0;font-size:14px">${r.ing.map(a=>a[0]+' '+gr(a[1]*f)+' г').join(', ')}</p><p class="sub" style="margin:0 0 10px">${r.how}</p>${menuL(r.t).length>1?`<button class="sec" onclick="swap(${mday},${j})">Заменить блюдо</button>`:''}</div>`}).join('')}`}

let RB='';
function banner(){return RB?`<div class="card rb" style="border-color:var(--warm)"><b>${RB}</b><button style="width:100%;margin-top:8px" onclick="RB='';this.parentNode.remove()">Понятно</button></div>`:''}
function fire(id){RB=REM[id][2];document.querySelectorAll('.rb').forEach(e=>e.remove());$('app').insertAdjacentHTML('afterbegin',banner());try{if(!CAP()&&window.Notification&&Notification.permission==='granted')new Notification('Темп',{body:RB})}catch(e){}try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
function needs(id){const d=iso(new Date()),x=S.days[d]||{},c=calc(S.profile);
if(id==='wt')return !x.weight;if(id==='train'){const n=S.planStart?dd(S.planStart,d):-1;return n>=0&&n<56&&dy(S.profile).indexOf(n%7)>=0&&!(x.workout&&x.workout.done)}
if(id[0]==='w')return (x.water||0)<c.water;return true}
function tick(){if(!S.profile||!S.rem)return;const n=new Date(),m=n.getHours()*60+n.getMinutes(),d=iso(n);S.remLast=S.remLast||{};
Object.keys(REM).forEach(id=>{const c=remCfg(id);if(!c.on||S.remLast[id]===d)return;const p=c.t.split(':'),tm=(+p[0])*60+(+p[1]);if(m>=tm&&m-tm<=30&&needs(id)){S.remLast[id]=d;save();fire(id)}})}
setInterval(tick,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

POOL.pl.push({n:'Тяга под столом',h:1,t:'Лягте под крепкий стол и тянитесь грудью к краю, тело прямое'});
POOL.pd.push({n:'Супермен',h:1,t:'Лёжа на животе поднимайте руки и ноги, пауза 2 секунды'});
POOL.pv.push({n:'Обратные отжимания от стула',h:1,a:'shoulder',t:'Руки на сиденье сзади, опускайтесь до угла 90° в локтях'});
POOL.sq.push({n:'Приседание на стул',h:1,t:'Садитесь на край стула и вставайте без раскачки'});
POOL.pu.push({n:'Отжимания узким хватом',h:1,a:'shoulder',t:'Ладони под грудью, локти вдоль тела'});
/* оборудование: нужное (db гантели, bb штанга, band резина, bar турник, rope скакалка, chair стул) и чем заменить дома */
const EQ={'Гоблет-присед с гантелью':['db','бутыль воды 5 л или рюкзак с вещами у груди'],'Румынская тяга с гантелями':['db','две сумки или рюкзак с вещами в руках'],'Жим гантелей лёжа':['db','две бутыли воды по 1,5–2 л, лёжа на полу вместо скамьи'],'Жим гантелей стоя':['db','две бутылки воды или тяжёлые книги в руках'],'Махи гантелей в стороны':['db','две бутылки воды по 0,5–1 л'],'Тяга гантели в наклоне':['db','рюкзак с вещами или сумка с бутылками'],'Тяга резины к поясу':['band','полотенце на дверной ручке, тяните на себя'],'Тяга резины сверху':['band','полотенце на дверной ручке, тяните вниз'],'Подтягивания':['bar','крепкий стол: «тяга под столом»'],'Скакалка, интервалы 30/30':['rope','прыжки на месте, имитируя вращение скакалки'],'Отжимания с ногами на опоре':['','ноги на стул или диван'],'Болгарские выпады':['','задняя нога на стул или диван'],'Обратные отжимания от стула':['chair','нужен устойчивый стул или край дивана'],'Приседание на стул':['chair','любой устойчивый стул'],'Тяга под столом':['','нужен крепкий стол, который выдержит ваш вес']};
function eqOk(n,q){const r=(EQ[n]||[''])[0];return !r||r==='chair'||(q.eq||[]).indexOf(r)>=0}
function locOf(p,d){return p.place==='gym'?'gym':(p.place==='mixed'?((S.days[d]&&S.days[d].loc)||'home'):'home')}
function setLoc(d,v){day(d).loc=v;save();render()}
function locSel(p,d){const l=locOf(p,d);if(p.place!=='mixed')return `<div class="sub" style="margin:6px 0">Место: ${l==='gym'?'зал':'дома'}</div>`;return `<div class="chips" style="margin:8px 0">${[['home','Сегодня дома'],['gym','Сегодня в зале']].map(a=>`<button class="${l===a[0]?'':'sec'}" onclick="setLoc('${d}','${a[0]}')">${a[1]}</button>`).join('')}</div>`}
function subs(wk){return wk.loc!=='home'?'':'<details class="ex"><summary><b>Чем заменить оборудование дома</b></summary><small>Гантели: бутылки с водой 1,5–5 л, рюкзак с книгами или консервами.<br>Штанга: рюкзак, набитый вещами, или сумка с водой.<br>Резиновая лента: полотенце или ремень на дверной ручке, тянуть на себя.<br>Турник: крепкий стол (тяга под столом) или перекладина в дверном проёме.<br>Скамья: диван, прочный стул или пол.<br>Скакалка: прыжки на месте, как будто крутите скакалку.</small></details>'}
function eqBox(q){const E=[['db','Гантели'],['bb','Штанга'],['band','Резиновые ленты'],['bar','Турник'],['bench','Скамья'],['rope','Скакалка']];return `<label>Что есть дома</label><div class="chips">${E.map(a=>`<label class="cb" style="margin:0;border:0;color:var(--ink);font-size:14px"><input class="eqc" type="checkbox" value="${a[0]}" ${(q.eq||[]).indexOf(a[0])>=0?'checked':''}><span>${a[1]}</span></label>`).join('')}</div><p class="sub" style="margin:4px 0 0">Если ничего нет, дома будут упражнения без оборудования.</p>`}

const OPEN={};
function acc(){if(['today','profile'].indexOf(tab)<0)return;document.querySelectorAll('#app .card').forEach(c=>{const h=c.firstElementChild;if(!h||h.tagName!=='H2')return;const t=h.textContent,b=document.createElement('div');b.className='bd';while(h.nextSibling)b.appendChild(h.nextSibling);c.appendChild(b);c.classList.add('acc');if(OPEN[t])c.classList.add('op');h.onclick=()=>{OPEN[t]=!OPEN[t];c.classList.toggle('op')}})}

/* системные уведомления в APK (Capacitor Local Notifications) */
const CAP=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const LNP=()=>CAP()&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
async function syncNotifs(){const LN=LNP();if(!LN||!S.profile)return;
try{const pend=await LN.getPending();if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
const list=[];Object.keys(REM).forEach((id,ix)=>{const c=remCfg(id);if(!c.on)return;const p=c.t.split(':'),hour=+p[0],minute=+p[1];
if(id==='train')dy(S.profile).forEach(di=>list.push({id:100+di,title:'Темп',body:REM[id][2],schedule:{on:{weekday:(di+1)%7+1,hour,minute},allowWhileIdle:true}}));
else list.push({id:ix+1,title:'Темп',body:REM[id][2],schedule:{on:{hour,minute},allowWhileIdle:true}})});
if(list.length)await LN.schedule({notifications:list})}catch(e){toast('Не удалось запланировать уведомления')}}
load();render();tick();syncNotifs();
</script>
